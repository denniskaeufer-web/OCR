flex-wrap:wrap;gap:8px;color:#e1e9db;margin-top:12px}.pill{display:inline-flex;align-items:center;gap:6px;background:#ffffff12;border:1px solid #ffffff1b;border-radius:999px;padding:6px 10px;font-size:12px}.metric-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.metric{background:var(--surface2);padding:14px;border-radius:16px}.metric strong{font-size:20px;display:block;letter-spacing:-.035em;margin-top:6px}.metric span{font-size:11px;color:var(--muted)}.section-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:22px 0 11px}.section-head h2{margin:0}.linkbtn{border:0;background:transparent;color:var(--accent);font-size:13px;font-weight:800;padding:8px}.workout{border:1px solid var(--line);border-radius:17px;padding:13px;background:var(--surface2);display:flex;gap:12px;align-items:center;justify-content:space-between;margin:9px 0}.workout.disabled{opacity:.65}.workout-main{min-width:0;flex:1}.workout-name{font-weight:800;font-size:15px}.workout-meta{font-size:12px;color:var(--muted);margin-top:5px}.glyph{height:39px;width:39px;flex:0 0 39px;display:grid;place-items:center;border-radius:12px;background:#a8f07a19;font-size:20px}.workout-left{display:flex;align-items:center;gap:11px;min-width:0;flex:1}.primary{background:var(--accent);border:1px solid var(--accent);border-radius:14px;color:#142416;min-height:46px;padding:10px 15px;font-weight:850}.secondary{background:var(--surface2);border:1px solid var(--line);border-radius:14px;color:var(--text);min-height:44px;padding:9px 13px;font-weight:700}.danger{color:var(--error);border-color:#76534d}.wide{width:100%}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions>*{flex:1}.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#111d1aef;backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px max(10px,env(safe-area-inset-right)) calc(7px + env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-lef 06056;border-radius:12px;padding:12px;min-height:46px}.field textarea{min-height:80px;resize:vertical}.selection{display:flex;flex-wrap:wrap;gap:8px}.selection button{border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:var(--surface2);color:var(--text);font-weight:750}.selection button.selected{background:var(--accent);color:#172416;border-color:var(--accent)}.hint{background:#28372d;border-left:3px solid var(--accent);border-radius:10px;padding:11px;font-size:12px;line-height:1.5;color:#d8eadb;margin:12px 0}.warning{background:#402f29;border-left-color:var(--gold);color:#ffe9d3}.empty{text-align:center;color:var(--muted);padding:25px 10px}.routine{font-size:13px;color:var(--muted);line-height:1.55}.stat-bar{height:8px;border-radius:999px;background:#31423a;overflow:hidden;margin:8px 0}.stat-bar>div{height:100%;background:var(--accent);border-radius:999px}.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:min(92vw,500px);padding:12px 18px;border-radius:13px;background:#e2f6d0;color:#172618;z-index:99;font-weight:800;box-shadow:var(--shadow);font-size:13px}.phase{display:flex;gap:8px;align-items:center;margin:13px 0}.phase .dot{width:20px;height:5px;background:#46594c;border-radius:8px;flex:1}.phase .dot.on{background:var(--accent)}.onboarding{max-width:660px;margin:10px auto}.onboarding h1{font-size:30px}.help{font-size:12px;color:var(--muted);line-height:1.5}.details{font-size:13px;line-height:1.5;color:#c8d9d0}.footer-note{font-size:11px;color:var(--muted);line-height:1.6;margin-top:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mode{border:1px solid var(--line);padding:13px;border-radius:16px}.mode b{display:block;margin-bottom:5px}.mode small{color:var(--muted)}.tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.btn-text{font-size:12px}.data-block{font-size:12px;line-height:1.6;background:var(--surface2);padding:13px;border-radius:12px;overflow-wrap:anywhere}@media(min-width:760px){.content{padding:8px 28px 115px}.top{padding:30px 28px 20px}.desktop-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px}.desktop-grid>.card{margin:0}.modal-wrap{align-items:center}.modal{border-radius:24px;max-height:90vh}.nav{max-width:670px;left:50%;right:auto;transform:translateX(-50%);border:1px solid var(--line);border-radius:22px 22px 0 0;width:100%}}body.light{color-scheme:light;--bg:#f3f5f1;--surface:#ffffff;--surface2:#eef3eb;--muted:#50635a;--text:#14251d;--line:#d5e1d5;--accent:#39751e;--accent2:#26775b;--gold:#ae6b10;--error:#ac3e2d;--shadow:0 9px 30px #2a463b10}body.light .hero{background:linear-gradient(125deg,#d8ebce,#eaf4e1);border-color:#afcca0}body.light .hero .muted,body.light .hero .hero-details{color:#365542}body.light .primary{color:#fff}body.light .hero-details{color:#244326}body.light .nav{background:#f9fcf8f2}body.light .field input,body.light .field select,body.light .field textarea{background:white;color:#14251d;border-color:#b7c9b9}body.light .hint{color:#244326;background:#e2f0d9}body.light .warning{color:#774623;background:#fff1dd}body.light .chip.run{background:#d9eee2;color:#1a6349}body.light .chip.strength{background:#ffefd5;color:#7a4a12}body.light .chip.grip{background:#eadffc;color:#5b4286}body.light .chip.recovery{background:#e0e8e9;color:#34555b}body.light .chip.done{background:#dbefd5;color:#346629}body.light .chip.skipped{background:#f9e5e0;color:#9b493b}body.light .chip.event{background:#e1ecfa;color:#315b8e}body.light .chip.other{background:#e9efd9;color:#4a6628}body.light .modal-wrap{background:#020806aa}body.light .selection button{color:#14251d}body.light .selection button.selected{color:#fff}body.light .metric strong{color:var(--text)}body.light .date-card.today{border-color:#4c9c40}body.light .footer-note{color:#5c7063}
</style></head><body><div id="app" class="app"></div><div id="portal"></div>
<script>
(()=>{'use strict';
const STORE='ocr-coach-v1',WEEK=7*864e5; const $=s=>document.querySelector(s);
const glyph={run:'↗',strength:'◆',grip:'⌁',recovery:'☾',other:'✦',event:'▣'};
const typeText={run:'Laufen',strength:'Kraft',grip:'OCR & Grip',recovery:'Erholung',other:'Zusatzaktivität',event:'Termin'};
const defaults={name:'',distance:'medium',fitness:'intermediate',raceDate:'',minutes:300,days:[1,2,4,6],equipment:['bodyweight','hills'],theme:'dark',weeks:[],activities:[],events:[],history:[],createdAt:'',runWeekKm:'',longestKm:'',verticalWeek:'',ocrExperience:'first',weakness:'grip',priority:'balanced',raceName:'',raceKm:'',raceHm:'',raceObstacles:'',gripSeconds:'',trainingYears:'',trainingEnvironment:'',trainingReady:null,dayMinutes:{},aiSource:false,aiInfo:null,needsAIUpdate:false,version:1};
let state=load(),page='today',weekOffset=0,modal=null,toastTimer=null,onboardStep=0,setup={...defaults},editId=null,editAction=null,lastBackup=null,profileDraft=null,coachConfig={url:localStorage.getItem('ocr-ai-server-url')||'',token:sessionStorage.getItem('ocr-ai-pilot-token')||''},aiPending=false;
function pad(n){return String(n).padStart(2,'0')}function iso(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}function local(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12)}function add(s,n){let d=local(s);d.setDate(d.getDate()+n);return iso(d)}function monday(s){let d=local(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}function human(s,opt={}){return local(s).toLocaleDateString('de-DE',opt)}function cap(s){return s[0].toUpperCase()+s.slice(1)}function uid(){return 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function load(){try{let d=JSON.parse(localStorage.getItem(STORE));if(d&&d.version===1)return {...structuredClone(defaults),...d}}catch(e){}return structuredClone(defaults)}
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){notify('Speichern nicht möglich: Browser-Speicher prüfen.')}}
function notify(s){const old=$('.toast');if(old)old.remove();let t=document.createElement('div');t.className='toast';t.textContent=s;document.body.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),4200)}
function snapshot(){lastBackup=structuredClone(state)}function undo(){if(!lastBackup)return;state=lastBackup;lastBackup=null;save();render();notify('Letzte Änderung rückgängig gemacht')}
function clean(s){return esc(s)}function fmtMin(n){return n>=60?`${Math.floor(n/60)} h${n%60?' '+n%60+' min':''}`:`${n} min`};function wNow(){return monday(iso(new Date()))}function thisWeek(){return add(wNow(),weekOffset*7)}function within(d,start){return d>=start&&d<=add(start,6)}
function weekAll(){return state.weeks.flatMap(w=>w.sessions)}function findSession(id){return weekAll().find(s=>s.id===id)}function getWeek(start){return state.weeks.find(w=>w.start===start)}function actualInWeek(start){return state.activities.filter(a=>within(a.date,start))}function eventOn(date){return state.events.filter(e=>e.date===date)}function plansOn(date){return weekAll().filter(s=>s.date===date)}function formatDay(s){return human(s,{weekday:'long',day:'numeric',month:'long'})}
function computeTemplate(cat,fitness,minutes,gear,weekNo){let factor={beginner:.72,intermediate:1,advanced:1.18}[fitness]||1;let capMinutes=clamp(Math.round(minutes),90,900);let base={short:55,medium:75,long:105,ultra:135}[cat]||70;let growth=1+Math.min(weekNo%4,2)*.07; if(weekNo%4===3)growth=.76; let arr=[
{type:'run',role:'easy',name:'Lockerer Lauf',duration:clamp(Math.round(45*factor*growth/5)*5,20,70),rpe:3,detail:'Ruhiges, kontrolliertes Tempo. Du kannst dich unterhalten. Locker beginnen und bei Bedarf Gehpausen einbauen.'},
{type:'grip',role:'skill',name:'Grip & Hindernistechnik',duration:clamp(Math.round(40*factor/5)*5,20,65),rpe:4,detail:'10 Min. mobilisieren/aufwärmen. Griffwechsel an sicherem Gerät, kontrollierte Hangvarianten und Technikübungen. Pausen zwischen den Versuchen; keine Übungen bis zum Muskelversagen.'},
{type:'run',role:'quality',name:gear.includes('hills')?'Berg-/Tempoeinheit':'Kontrollierte Tempoeinheit',duration:clamp(Math.round(base*.75*factor*growth/5)*5,25,100),rpe:6,detail:gear.includes('hills')?'15 Min. locker, 4–6 kontrollierte Bergwiederholungen mit lockeren Geh-/Trabpausen, 10 Min. auslaufen. Umfang ans eigene Niveau anpassen.':'15 Min. locker, 3–4 zügige Abschnitte mit lockeren Pausen, 10 Min. auslaufen. Keine maximale Belastung.'},
{type:'strength',role:'strength',name:'Kraft & Carry',duration:clamp(Math.round(45*factor/5)*5,20,75),rpe:5,detail:'Aufwärmen, kontrollierte Kniebeuge-/Hüftstreckvarianten, Ziehen, Drücken und Tragen. Mit Körpergewicht oder vorhandenem Equipment; Technik vor Last.'},
{type:'run',role:'long',name:cat==='short'?'Längerer lockerer Lauf':'Longrun / Trail',duration:clamp(Math.round(base*factor*growth/5)*5,30,cat==='ultra'?225:cat==='long'?180:120),rpe:4,detail:'Lange, überwiegend lockere Ausdauereinheit. Untergrund und Höhenmeter nach Erfahrung. Verpflegung und Material bei längeren Einheiten erproben; kein erzwungenes Distanzziel.'},
{type:'grip',role:'skill2',name:'OCR-Technik kompakt',duration:25,rpe:3,detail:'Bewegungstechnik an sicherem Rig, Balance und leichte Grifffolgen. Ausreichend Erholung zwischen Versuchen.'},
{type:'recovery',role:'recovery',name:'Aktive Erholung',duration:20,rpe:1,detail:'Lockere Mobilität oder Spaziergang – bei Müdigkeit vollständige Pause.'}];
let slots=arr.slice(0,cat==='ultra'?6:5); let n=clamp(Math.round(capMinutes/80),2,6);if(n===2)slots=[arr[0],arr[4]];else if(n===3)slots=[arr[0],arr[1],arr[4]];else if(n===4)slots=[arr[0],arr[1],arr[3],arr[4]];else if(n===5)slots=[arr[0],arr[1],arr[2],arr[3],arr[4]];else slots=[arr[0],arr[1],arr[2],arr[3],arr[4],arr[5]];
let runKm=Number(state.runWeekKm),longKm=Number(state.longestKm);
if(state.runWeekKm!==''&&Number.isFinite(runKm)&&runKm>=0){let budget=runKm<10?0.66:runKm<25?0.84:runKm>60?1.08:1;slots=slots.map(x=>x.type==='run'?{...x,duration:Math.max(20,Math.round(x.duration*budget/5)*5)}:x)}
if(state.longestKm!==''&&Number.isFinite(longKm)&&longKm>=0){slots=slots.map(x=>x.role==='long'?{...x,duration:Math.min(x.duration,Math.max(30,Math.round((longKm*8+20)/5)*5))}:x)}
if(state.ocrExperience==='first')slots=slots.map(x=>x.type==='grip'?{...x,rpe:3,detail:'Technik im sicheren, bodennahen Aufbau. Zuerst kontrollierte Grundbewegungen und Pausen, keine Maximalversuche.'}:x);
if(state.priority==='grip'||state.weakness==='grip')slots=slots.map(x=>x.role==='skill2'?{...x,name:'Grip & Rig Technik kompakt'}:x);
if(state.priority==='trail'&&gear.includes('hills'))slots=slots.map(x=>x.role==='long'?{...x,name:'Trail-Longrun · Höhenmeter'}:x);
let sum=slots.reduce((a,b)=>a+b.duration,0);let ratio=Math.min(1,capMinutes/sum);return slots.map(x=>({...x,duration:Math.max(20,Math.round(x.duration*ratio/5)*5)}))}
function createPlan(){const today=iso(new Date()),first=monday(today);let weeks=[];let count=12;if(state.raceDate){count=clamp(Math.ceil((local(state.raceDate)-local(first))/WEEK)+1,2,16)}for(let wi=0;wi<count;wi++){let start=add(first,wi*7),dates=state.days.slice().sort((a,b)=>a-b).map(d=>add(start,(d+6)%7));let slots=computeTemplate(state.distance,state.fitness,state.minutes,state.equipment,wi);slots=slots.slice(0,dates.length);let sum=slots.reduce((a,x)=>a+x.duration,0);if(sum>state.minutes){let scale=state.minutes/sum;slots=slots.map(x=>({...x,duration:Math.max(15,Math.round(x.duration*scale/5)*5)}))}let sessions=slots.map((x,i)=>({...x,id:uid(),date:dates[i],status:'planned',feedback:null,originDate:dates[i],note:'',adapted:false}));if(wi===0)sessions=sessions.filter(s=>s.date>=today);if(state.raceDate)sessions=sessions.filter(s=>s.date<=state.raceDate);weeks.push({start,sessions})}state.weeks=weeks;save()}
function runDays(){let m=state.minutes;if(m<160)return 2;if(m<270)return 3;if(m<380)return 4;if(m<510)return 5;return 6}
function usableDays(){return state.days.slice().sort((a,b)=>a-b)}
function header(){return `<header class="top"><div><div class="brand">OCR COACH <span style="color:var(--muted);font-weight:500;letter-spacing:0">/ BETA 0.4</span></div><div class="logo">${page==='today'?'BE READY.':page==='plan'?'DEIN PLAN.':page==='training'?'TRAINING.':page==='progress'?'FORTSCHRITT.':'DEIN PROFIL.'}</div></div><div class="header-buttons"><button class="icon-btn" data-act="theme" aria-label="Design wechseln">${state.theme==='dark'?'☀':'☾'}</button><button class="icon-btn" data-act="backup" aria-label="Daten sichern">⇩</button></div></header>`}
function nav(){return `<nav class="nav" aria-label="Hauptnavigation">${[['today','⌂','Heute'],['plan','▦','Plan'],['training','✦','Training'],['progress','↗','Fortschritt'],['profile','◉','Profil']].map(([p,ico,label])=>`<button data-page="${p}" class="${page===p?'active':''}" aria-current="${page===p?'page':'false'}"><b>${ico}</b><span>${label}</span></button>`).join('')}</nav>`}
function pill(t){return `<span class="pill">${t}</span>`}function badge(s){return `<span class="chip ${s.status==='done'?'done':s.status==='skipped'?'skipped':s.type}">${s.status==='done'?'Erledigt':s.status==='skipped'?'Ausgelassen':typeText[s.type]}</span>`}
function workout(s,compact=false){return `<div class="workout ${s.status==='skipped'?'disabled':''}"><div class="workout-left"><div class="glyph" aria-hidden="true">${glyph[s.type]}</div><div class="workout-main"><div class="workout-name">${clean(s.name)}</div><div class="workout-meta">${fmtMin(s.duration)} · ${s.status==='done'?'Abgeschlossen':s.status==='skipped'?'Ausgelassen':`Ziel-RPE ${s.rpe}/10`}${s.adapted?' · Angepasst':''}${s.note?' · '+clean(s.note):''}</div><div class="tagrow">${badge(s)}</div></div></div><button class="icon-btn" data-act="session" data-id="${s.id}" aria-label="Einheit öffnen">↗</button></div>`}
function calcWeek(w){const planned=w?.sessions||[];const acts=actualInWeek(w?.start||wNow());return {mins:planned.filter(s=>s.status==='done').reduce((a,x)=>a+x.duration,0)+acts.reduce((a,x)=>a+x.duration,0),done:planned.filter(s=>s.status==='done').length,scheduled:planned.filter(s=>s.status!=='skipped').length,load:planned.filter(s=>s.status==='done').reduce((a,x)=>a+x.duration*(x.feedback?.rpe||x.rpe),0)+acts.reduce((a,x)=>a+x.duration*x.rpe,0)}}

}else if(s.role==='easy'||(s.type==='run'&&s.role!=='long')){
const warm=Math.min(10,Math.max(4,Math.round(d*.16))),cool=Math.min(7,Math.max(3,Math.round(d*.12))),main=d-warm-cool;
goal='Lockere aerobe Grundlagenausdauer aufbauen, ohne zusätzliche hohe Belastung.';target='RPE 2–3/10; Sprechtest: ganze Sätze sind möglich.';
phase('Locker starten',warm,[`${warm} Min. sehr locker anlaufen oder bei Bedarf zügig gehen.`]);
phase('Ruhiger Hauptteil',main,[`${main} Min. gleichmäßig locker laufen; Tempo an Tagesform und Untergrund anpassen.`, 'Bei Anstiegen Tempo reduzieren und bei Bedarf gehen. Kein Zeit- oder Kilometerziel erzwingen.']);
phase('Locker auslaufen',cool,[`${cool} Min. langsamer werden, bei Bedarf gehen.`]);
alternative='Bei wenig Zeit Hauptteil verkürzen. An einem schlechten Tag lockere Geh-/Laufintervalle statt eines durchgehenden Laufs.';

}else if(s.role==='long'){

goal='Zeit auf den Beinen und geländespezifische Ausdauer trainieren; keine Tempoprüfung.';target='Überwiegend RPE 3–4/10. An steilen Anstiegen kontrolliert gehen.';

phase('Abschluss',cool,[`${cool} Min. Hände und Schultern lockern; keine schmerzhaften Dehnungen erzwingen.`]);

function workoutGuide(s){if(s.aiGenerated){return `<div class="card" style="box-shadow:none;margin:14px 0"><div class="eyebrow">INDIVIDUELLER KI-TRAININGSENTWURF</div><div class="details" style="margin:10px 0">${clean(s.reason)}</div>${[['Aufwärmen',s.warmup],['Hauptteil',s.main],['Abschluss',s.cooldown],['Technikhinweise',s.technique],['Alternative',s.alternative]].map(([title,v])=>`<div style="border-top:1px solid var(--line);padding:12px 0"><h3>${title}</h3><p class="details" style="white-space:pre-wrap">${clean(v)}</p></div>`).join('')}<div class="hint warning">KI-Vorschlag ohne medizinische Trainingsfreigabe. Bei Krankheit oder Beschwerden pausieren und individuell abklären.</div></div>`;}let g=workoutInstructions(s);return `<div class="card" style="margin:14px 0;box-shadow:none"><div class="eyebrow">DEINE TRAININGSANLEITUNG</div><h3 style="margin-top:8px">Ziel der Einheit</h3><div class="details">${clean(g.goal)}</div><div class="hint">Intensität: ${clean(g.target)}</div>${g.phases.map((p,i)=>`<div style="border-top:1px solid var(--line);padding:14px 0"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h3>${i+1}. ${clean(p.title)}</h3><span class="chip run">${fmtMin(p.minutes)}</span></div>${p.steps.map(step=>`<p class="details" style="margin:6px 0">• ${clean(step)}</p>`).join('')}</div>`).join('')}<div class="details" style="font-weight:750">Alternative</div><div class="details">${clean(g.alternative)}</div><div class="hint warning">${clean(g.safety)}</div><div class="footer-note">Die Phasen sind ein allgemeiner Trainingsentwurf, individuell anpassen. RPE: 0 = Ruhe, 10 = maximal anstrengend. Die angegebenen Pausen sind im Hauptteil enthalten.</div></div>`}

async function copyCoachQuestion(kind,id){const x=kind==='session'?findSession(id):state.activities.find(a=>a.id===id);if(!x)return;const q=$('#coachquestion')?.value.trim();if(!q)return notify('Bitte erst eine Frage eingeben.');x.question=q.slice(0,400);save();const prompt=`Du bist ein verständlicher OCR-Trainingsassistent. Erkläre die folgende Frage sachlich und berücksichtige, dass es sich um einen allgemeinen Trainingsentwurf ohne medizinische Trainingsfreigabe handelt. Aktivität: ${x.name}, Dauer ${x.duration} Minuten, Typ: ${typeText[x.type]||'Zusatzaktivität'}, vorgesehene/empfundene Anstrengung RPE ${x.rpe}/10. Frage: ${x.question}. Bitte antworte konkret und verständlich auf Deutsch und benenne nötige Annahmen.`;try{await navigator.clipboard.writeText(prompt);notify('Frage kopiert. Jetzt in ChatGPT einfügen.')}catch(e){const field=$('#coachquestion');if(field){field.focus();field.select()}notify('Bitte deine Frage markieren und kopieren – Clipboard-Zugriff nicht erlaubt.')}}

function editProfileModal(){return `<div class="modal-head"><div><div class="eyebrow">EINSTELLUNGEN</div><h2>Profil anpassen</h2></div><button class="icon-btn" data-act="close">×</button></div><div class="field"><label for="pname">Vorname</label><input id="pname" maxlength="30" value="${esc(state.name)}"></div><div class="field"><label for="pdist">Renndistanz</label><select id="pdist">${[['short','Short · 5–8 km'],['medium','Medium · 10–15 km'],['long','Long · 15–30 km'],['ultra','Ultra · 30+ km']].map(([id,t])=>`<option value="${id}" ${state.distance===id?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="pfit">Leistungsniveau</label><select id="pfit"><option value="beginner" ${state.fitness==='beginner'?'selected':''}>Einsteiger</option><option value="intermediate" ${state.fitness==='intermediate'?'selected':''}>Erfahren</option><option value="advanced" ${state.fitness==='advanced'?'selected':''}>Fortgeschritten</option></select></div><div class="field"><label for="prace">Wettkampftermin (optional)</label><input id="prace" type="date" value="${state.raceDate}" min="${iso(new Date())}"></div><div class="field"><label for="pminutes">Minuten pro Woche</label><input id="pminutes" type="number" min="90" max="900" value="${state.minutes}"></div><div class="field"><div class="label">Verfügbare Trainingstage</div>${choice([[1,'Mo'],[2,'Di'],[3,'Mi'],[4,'Do'],[5,'Fr'],[6,'Sa'],[7,'So']],profileDraft.days,'days',true)}</div><div class="field"><div class="label">Trainingsorte / Equipment</div>${choice([['bodyweight','Körpergewicht'],['hills','Hügel'],['gym','Fitnessstudio'],['obstacles','OCR-Anlage'],['treadmill','Laufband']],profileDraft.equipment,'equipment',true)}</div><div class="line"></div><h3>Rennprofil und Laufumfang</h3><div class="field"><label for="praceName">Rennname (optional)</label><input id="praceName" maxlength="60" value="${esc(state.raceName||'')}"></div><div class="grid2"><div class="field"><label for="praceKm">Distanz km</label><input id="praceKm" type="number" min="1" max="300" value="${esc(state.raceKm||'')}"></div><div class="field"><label for="praceHm">Höhenmeter</label><input id="praceHm" type="number" min="0" max="30000" value="${esc(state.raceHm||'')}"></div></div><div class="field"><label for="praceObstacles">Hindernisanzahl</label><input id="praceObstacles" type="number" min="0" max="300" value="${esc(state.raceObstacles||'')}"></div><div class="grid2"><div class="field"><label for="prunWeekKm">Laufkilometer/Woche</label><input id="prunWeekKm" type="number" min="0" max="300" value="${esc(state.runWeekKm??'')}"></div><div class="field"><label for="plongestKm">Längster Lauf km</label><input id="plongestKm" type="number" min="0" max="300" value="${esc(state.longestKm??'')}"></div></div><div class="field"><label for="pverticalWeek">Höhenmeter/Woche</label><input id="pverticalWeek" type="number" min="0" max="25000" value="${esc(state.verticalWeek??'')}"></div><div class="field"><label for="pocrExperience">OCR-Erfahrung</label><select id="pocrExperience">${[['first','Noch kein Rennen'],['some','1–5 Rennen'],['many','Mehr als 5 Rennen']].map(([v,t])=>`<option value="${v}" ${state.ocrExperience===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="pweakness">Größte Schwierigkeit</label><select id="pweakness">${[['grip','Grip / Rig'],['carry','Tragen'],['wall','Wall / Climb'],['endurance','Laufausdauer'],['downhill','Bergab laufen'],['none','Noch unklar']].map(([v,t])=>`<option value="${v}" ${state.weakness===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="ppriority">Dein Schwerpunkt</label><select id="ppriority">${[['balanced','Ausgewogener OCR-Plan'],['grip','Hindernisse & Grip'],['trail','Berge & Trail'],['speed','Lauftempo'],['endurance','Lange Ausdauer']].map(([v,t])=>`<option value="${v}" ${state.priority===v?'selected':''}>${t}</option>`).join('')}</select></div><div class="line"></div><h3>Zusätzliche Angaben für die KI</h3><div class="field"><label for="ptrainingYears">Jahre regelmäßiges Training (optional)</label><input id="ptrainingYears" type="number" min="0" max="50" step="0.5" value="${esc(state.trainingYears??'')}"></div><div class="field"><label for="pgripSeconds">Hängezeit in Sekunden (optional)</label><input id="pgripSeconds" type="number" min="0" max="600" value="${esc(state.gripSeconds??'')}"></div><div class="field"><label for="ptrainingEnvironment">Trainingsalltag und Trainingsorte</label><textarea id="ptrainingEnvironment" maxlength="400" placeholder="z. B. Schichtarbeit, flaches Gelände, nur Dienstag Gym">${esc(state.trainingEnvironment||'')}</textarea></div><div class="field"><div class="label">Maximale Zeit je verfügbarem Trainingstag (Minuten)</div>${profileDraft.days.slice().sort((a,b)=>a-b).map(d=>`<label class="field" style="display:flex;align-items:center;gap:12px"><span style="width:45px">${['','Mo','Di','Mi','Do','Fr','Sa','So'][d]}</span><input type="number" style="flex:1;min-width:0" min="20" max="600" data-pdaymin="${d}" value="${esc(profileDraft.dayMinutes[d]||Math.max(20,Math.round(state.minutes/profileDraft.days.length)))}"></label>`).join('')}</div><div class="field"><label for="ptrainingReady">Ist Training derzeit ohne ungeklärte Beschwerden oder Krankheit möglich?</label><select id="ptrainingReady"><option value="" ${state.trainingReady===null?'selected':''}>Bitte auswählen</option><option value="true" ${state.trainingReady===true?'selected':''}>Ja</option><option value="false" ${state.trainingReady===false?'selected':''}>Nein / derzeit unklar</option></select></div><button class="primary wide" data-act="saveprofile">Profil speichern</button><div class="footer-note">Die Änderung am Sportlerprofil startet keine Musterplanung. Du kannst danach einen neuen KI-Plan anfordern.</div>`}
function confirmModal(){return `<div class="modal-head"><div><div class="eyebrow">BITTE BESTÄTIGEN</div><h2>${clean(modal.title)}</h2></div><button class="icon-btn" data-act="close">×</button></div><p class="details">${clean(modal.text)}</p><div class="actions"><button class="secondary" data-act="close">Abbrechen</button><button class="primary" data-act="confirmdialog">${clean(modal.button)}</button></div>`}

function aiCard(){return `<div class="eyebrow">PERSÖNLICHER KI-COACH</div><h2 style="margin-top:7px">${state.aiSource?'Dein KI-Plan ist gespeichert':'Dein Profil → ein echter KI-Plan'}</h2><div class="details">${state.aiSource?'Die nächsten 14 Tage wurden individuell per KI geplant. Nach zusätzlichen Aktivitäten oder geänderten Terminen kannst du die kommenden zwei Wochen erneut planen lassen.':'Hier wird kein Musterplan als KI ausgegeben. Verbinde zuerst deinen privaten KI-Server und lass auf Basis des Sportlerprofils einen individuellen 14-Tage-Plan erstellen.'}</div><div class="actions" style="margin-top:13px"><button class="primary" data-act="aistart">${state.aiSource?'KI-Plan anpassen':'KI-Plan erstellen'}</button><button class="secondary" data-act="aisettings">⚙ KI-Zugang</button></div>${state.aiInfo?`<div class="footer-note">Letzte KI-Erstellung: ${clean(state.aiInfo.generatedAt?.slice(0,10)||'–')} · Modell: ${clean(state.aiInfo.model||'–')}</div>`:''}${state.needsAIUpdate?`<div class="hint warning">Neue Trainingsdaten oder Termine vorhanden: Lass deinen KI-Plan bei Bedarf erneut berechnen. Bisherige Änderungen werden nicht automatisch als KI-Anpassung ausgegeben.</div>`:''}<div class="footer-note">Ohne eigenen Server und API-Zugang läuft hier keine KI. Du bestätigst jede Datenübertragung und jede Planänderung.</div>`}
function aiSettingsModal(){return `<div class="modal-head"><div><div class="eyebrow">GESCHÜTZTE KI-ANBINDUNG</div><h2>KI-Zugang einrichten</h2></div><button class="icon-btn" data-act="close">×</button></div><div class="details">Trage die HTTPS-Adresse deines eigenen OCR-COACH-Servers ein. Den OpenAI-API-Schlüssel gibst du <strong>niemals hier</strong> ein; er bleibt ausschließlich auf dem Server.</div><div class="field"><label for="aiurl">Server-Adresse (z. B. https://meine-ocr-api.example)</label><input id="aiurl" type="url" autocapitalize="none" spellcheck="false" placeholder="https://..." value="${esc(coachConfig.url)}"></div><div class="field"><label for="aitoken">Privater Pilot-Zugangscode</label><input id="aitoken" type="password" autocomplete="off" placeholder="Zugangscode des Servers" value="${esc(coachConfig.token)}"></div><div class="hint warning">Diese Pilotversion hat noch keine Benutzerkonten. Den Zugangscode nicht teilen und den Server nicht öffentlich ohne Authentifizierung und Datenschutzprüfung anbieten.</div><button class="primary wide" data-act="aisavesettings">KI-Zugang speichern</button><div class="footer-note">Die Server-Adresse wird lokal, der Zugangscode nur für diese Browser-Sitzung gespeichert. Kosten für KI-Aufrufe entstehen beim jeweiligen API-Konto des Serverbetreibers.</div>`}
function aiConsentModal(){return `<div class="modal-head"><div><div class="eyebrow">DEIN TRAINING. DEINE ENTSCHEIDUNG.</div><h2>KI-Plan anfragen?</h2></div><button class="icon-btn" data-act="close">×</button></div><div class="details">Für die individuelle Trainingsplanung werden dein Sportlerprofil, dein aktueller Trainingskalender, Feedback, erfasste Aktivitäten und Termine an deinen eingerichteten Server und darüber an den KI-Anbieter gesendet. Die KI erstellt einen Vorschlag für die nächsten 14 Tage samt langfristiger Ausrichtung.</div><div class="hint">Vorhandene Daten werden nicht sofort geändert: Du prüfst den generierten Plan und bestätigst ihn erst danach. Abgeschlossene Einheiten bleiben gespeichert.</div>${state.trainingReady!==true?`<div class="hint warning">Bitte bestätige zuerst unter Profil → Profil ergänzen, dass Training derzeit ohne ungeklärte Beschwerden oder Krankheit möglich ist. Falls nicht, Training zunächst individuell abklären.</div>`:''}<div class="actions"><button class="secondary" data-act="close">Abbrechen</button><button class="primary" data-act="aifetch" ${state.trainingReady!==true?'disabled':''}>Daten senden & KI-Plan erstellen</button></div>`}
function aiLoadingModal(){return `<div class="modal-head"><div><div class="eyebrow">KI ARBEITET</div><h2>Dein Plan wird individuell erstellt …</h2></div></div><div class="hint">Der Server prüft die verfügbaren Tage und Zeitbudgets. Das kann etwas dauern. Bitte warte, bis die Vorschau erscheint.</div><button class="secondary wide" data-act="close">Fenster schließen (Anfrage läuft gegebenenfalls weiter)</button>`}
function aiResultModal(){let p=modal.plan, sessions=p.weeks.flatMap(w=>w.sessions);return `<div class="modal-head"><div><div class="eyebrow">KI-PLAN · VORSCHAU</div><h2>Deine nächsten 14 Tage</h2></div><button class="icon-btn" data-act="close">×</button></div><div class="details">${clean(p.summary)}</div><div class="hint"><strong>Warum dieser Plan?</strong><br>${clean(p.strategy)}</div>${p.assumptions.length?`<div class="footer-note"><strong>Annahmen:</strong> ${clean(p.assumptions.join(' · '))}</div>`:''}${p.weeks.map(w=>`<div style="margin-top:18px"><h3>Woche ab ${clean(w.start)} – ${clean(w.focus)}</h3>${w.sessions.map(s=>`<details class="workout" style="display:block"><summary style="cursor:pointer;font-weight:800">${clean(s.date)} · ${clean(s.name)} · ${s.duration} Min. · RPE ${s.rpe}/10</summary><p class="details">${clean(s.reason)}</p><p class="details"><b>Aufwärmen:</b> ${clean(s.warmup)}</p><p class="details"><b>Hauptteil:</b> ${clean(s.main)}</p><p class="details"><b>Abschluss:</b> ${clean(s.cooldown)}</p><p class="details"><b>Alternative:</b> ${clean(s.alternative)}</p></details>`).join('')}</div>`).join('')}${p.horizon.length?`<div class="hint">${p.horizon.map(h=>`<p><strong>${clean(h.phase)}</strong>: ${clean(h.focus)}</p>`).join('')}</div>`:''}<div class="hint warning">${state.aiSource?'Die Übernahme ersetzt nur offene Einheiten im 14-Tage-Zeitraum.':'Bei der ersten KI-Planung werden auch alle übrigen zukünftigen offenen Einheiten aus dem alten Musterentwurf entfernt, damit keine Musterwochen als KI-Plan weiterlaufen.'} Abgeschlossene und ausgelassene Einheiten sowie Zusatzaktivitäten bleiben erhalten. Keine medizinische Trainingsfreigabe.</div><div class="actions"><button class="secondary" data-act="close">Verwerfen</button><button class="primary" data-act="aiapply">Plan übernehmen</button></div>`}
function aiErrorModal(){return `<div class="modal-head"><div><div class="eyebrow">NOCH NICHT ERSTELLT</div><h2>KI-Plan fehlgeschlagen</h2></div><button class="icon-btn" data-act="close">×</button></div><div class="hint warning">${clean(modal.message||'KI-Server nicht erreichbar.')}</div><div class="details">Der bisherige Kalender bleibt unverändert. Bitte prüfe die Server-Einstellungen und versuche es erneut.</div><button class="secondary wide" data-act="aisettings">Server-Einstellungen prüfen</button>`}
function startAIPlan(){if(!coachConfig.url||!coachConfig.token)return open({type:'aisettings'});open({type:'aiconsent'});}
function aiProfile(){let {name,distance,fitness,raceDate,raceName,raceKm,raceHm,raceObstacles,minutes,days,equipment,runWeekKm,longestKm,verticalWeek,ocrExperience,weakness,priority,gripSeconds,trainingYears,trainingEnvironment,trainingReady,dayMinutes}=state;return {name,distance,fitness,raceDate,raceName,raceKm,raceHm,raceObstacles,minutes,days,equipment,runWeekKm,longestKm,verticalWeek,ocrExperience,weakness,priority,gripSeconds,trainingYears,trainingEnvironment,trainingReady,dayMinutes};}
function aiUrl(){let url=new URL(coachConfig.url);if(url.protocol!=='https:'&&!(['localhost','127.0.0.1'].includes(url.hostname)&&url.protocol==='http:'))throw Error('Bitte eine gültige HTTPS-Server-Adresse eingeben.');if(url.username||url.password||url.search||url.hash)throw Error('Die Server-Adresse darf keine Zugangsdaten oder Parameter enthalten.');return url.origin;}
async function aiPost(path,payload){let url=aiUrl();const c=new AbortController();let timeout=setTimeout(()=>c.abort(),105000);try{let res=await fetch(url+path,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+coachConfig.token},body:JSON.stringify(payload),signal:c.signal,cache:'no-store'});let data=await res.json();if(!res.ok)throw Error(data.error||'Serverfehler '+res.status);return data;}finally{clearTimeout(timeout)}}
async function requestAIPlan(){if(aiPending)return;aiPending=true;open({type:'ailoading'});try{let data=await aiPost('/api/plan',{profile:aiProfile(),context:{sessions:weekAll(),activities:state.activities,events:state.events}});if(!data.plan||!Array.isArray(data.plan.weeks)||!data.period?.start||!data.period?.end)throw Error('Unvollständiger KI-Plan');modal={type:'airesult',plan:data.plan,period:data.period,generatedAt:data.generatedAt,model:data.model};render();}catch(e){modal={type:'aierror',message:e.message||String(e)};render()}finally{aiPending=false}}
function applyAIPlan(){if(modal?.type!=='airesult')return;let {plan,period,generatedAt,model}=modal;let sessions=plan.weeks.flatMap(w=>w.sessions);if(!sessions.length)return notify('Der KI-Plan enthält keine Einheiten.');snapshot();let rangeStart=period.start,rangeEnd=period.end,firstAI=!state.aiSource;for(let w of state.weeks){w.sessions=w.sessions.filter(s=>!(s.status==='planned'&&s.date>=rangeStart&&(firstAI||s.date<=rangeEnd)));}
for(const raw of sessions){let start=monday(raw.date),w=state.weeks.find(x=>x.start===start);if(!w){w={start,sessions:[]};state.weeks.push(w)}if(w.sessions.some(s=>s.date===raw.date&&s.status==='done'))continue;w.sessions.push({...raw,id:uid(),status:'planned',feedback:null,originDate:raw.date,note:'Individuell von KI erstellt',adapted:false,aiGenerated:true});}
state.weeks.sort((a,b)=>a.start.localeCompare(b.start));state.aiSource=true;state.needsAIUpdate=false;state.aiInfo={generatedAt,model,summary:plan.summary,strategy:plan.strategy,horizon:plan.horizon};save();page='plan';weekOffset=0;close();notify('Individuellen KI-Plan übernommen');}
async function askAI(kind,id){let x=kind==='session'?findSession(id):state.activities.find(a=>a.id===id),q=$('#coachquestion')?.value?.trim();if(!x||!q)return notify('Bitte eine Frage zu dieser Einheit eingeben.');if(!coachConfig.url||!coachConfig.token)return open({type:'aisettings'});if(aiPending)return;aiPending=true;let button=$('[data-act="aiquestion"]');if(button){button.disabled=true;button.textContent='KI antwortet …';}try{let out=await aiPost('/api/question',{question:q.slice(0,400),session:x,profile:aiProfile()});x.question=q.slice(0,400);x.aiAnswer=out.answer;save();open({type:kind==='session'?'session':'activitydetail',id})}catch(e){notify('KI-Antwort fehlgeschlagen: '+(e.message||String(e)).slice(0,100));render()}finally{aiPending=false}}

function modals(){let body=modal.type==='session'?sessionModal(modal.id):modal.type==='action'?actionModal():modal.type==='activity'?activityModal():modal.type==='event'?eventModal():modal.type==='preview'?previewModal():modal.type==='activitydetail'?activityDetailModal(modal.id):modal.type==='day'?dayModal(modal.date):modal.type==='editprofile'?editProfileModal():modal.type==='aisettings'?aiSettingsModal():modal.type==='aiconsent'?aiConsentModal():modal.type==='ailoading'?aiLoadingModal():modal.type==='airesult'?aiResultModal():modal.type==='aierror'?aiErrorModal():modal.type==='confirm'?confirmModal():'';return `<div class="modal-wrap" id="modalwrap"><section class="modal" role="dialog" aria-modal="true" aria-label="OCR Coach Dialog">${body}</section></div>`}
function open(m){modal=m;render()}function close(){modal=null;editAction=null;render()}
function regenPreserve(){let old=weekAll().filter(s=>s.status!=='planned'||s.date<iso(new Date()));let oldIds=new Set(old.map(s=>s.id));createPlan();state.weeks.forEach(w=>{w.sessions=w.sessions.filter(s=>!old.some(o=>o.date===s.date)&&!state.events.some(e=>e.date===s.date&&e.hours===0));w.sessions.push(...old.filter(s=>within(s.date,w.start)))});save()}
function adaptUpcoming(date,kind,heavy,feeling){let changes=[];if(!heavy)return changes;const stop=kind==='ill'?3:2,after=add(date,stop);const upcoming=weekAll().filter(s=>s.status==='planned'&&s.date>date&&s.date>=iso(new Date())&&s.date<=after).sort((a,b)=>a.date.localeCompare(b.date));for(const s of upcoming){if(kind==='ill'||s.role==='quality'||s.role==='long'||s.rpe>=5){let before=`${formatDay(s.date)} · ${s.name}`,oldName=s.name;s.name=kind==='ill'?'Trainingspause / Erholung':'Erholung statt '+oldName;s.type='recovery';s.role='recovery';s.duration=kind==='ill'?0:20;s.rpe=kind==='ill'?0:1;s.detail='Erholung hat Vorrang. Belastung nicht nachholen; bei Beschwerden oder Krankheit individuell abklären.';s.note=kind==='ill'?'Pausiert wegen eingetragenem Unwohlsein':`Nach ${kind==='activity'?'zusätzlicher':'anstrengender'} Belastung reduziert`;s.adapted=true;changes.push({before,after:`${s.name}${s.duration?' · '+fmtMin(s.duration):''}`})}}return changes}
function proposeActivity(data){let preview=structuredClone(state),beforeState=state;state=preview;let changes=state.aiSource?[]:adaptUpcoming(data.date,'activity',data.duration>=90||data.rpe>=7);state=beforeState;return {changes,commit:()=>{snapshot();state.activities.push(data);if(state.aiSource){state.needsAIUpdate=true;}else{adaptUpcoming(data.date,'activity',data.duration>=90||data.rpe>=7)}save();close();notify(state.aiSource?'Aktivität gespeichert · KI-Neuplanung möglich':'Aktivität gespeichert · Wochenplan geprüft')}}}
function proposeEvent(data){let copy=structuredClone(state),before=state;state=copy;let changes=[];let blocked=weekAll().filter(s=>s.date===data.date&&s.status==='planned');for(const s of blocked){if(data.hours>=s.duration)continue;let prev=`${formatDay(s.date)} · ${s.name}`;if(data.hours>=15&&s.role!=='long'&&data.title!=='Trainingspause / Unwohlsein'){s.duration=Math.min(s.duration,data.hours);s.note='Auf verfügbare Zeit gekürzt';changes.push({before:prev,after:`Gekürzt auf ${fmtMin(s.duration)}`})}else{const dest=[1,2,3].map(n=>add(data.date,n)).find(d=>d<=add(thisWeek(),6)&&(!state.raceDate||d<=state.raceDate)&&!eventOn(d).some(e=>e.hours===0)&&!plansOn(d).some(x=>x.status==='planned')&&d>=iso(new Date()));if(dest&&data.title!=='Trainingspause / Unwohlsein'){s.date=dest;s.note='Wegen Termin verschoben';changes.push({before:prev,after:`Verschoben auf ${formatDay(dest)}`})}else{s.status='skipped';s.note='Wegen Termin/Trainingspause ausgelassen';changes.push({before:prev,after:'Ausgelassen (kein Nachholen)'})}}}if(data.title==='Trainingspause / Unwohlsein')changes.push(...adaptUpcoming(data.date,'ill',true));state=before;return {changes,commit:()=>{snapshot();state.events.push(data);for(const c of changes){} // repeat proposal with new event already in state
let on=weekAll().filter(s=>s.date===data.date&&s.status==='planned');for(const s of on){if(data.hours>=s.duration)continue;if(data.hours>=15&&s.role!=='long'&&data.title!=='Trainingspause / Unwohlsein'){s.duration=Math.min(s.duration,data.hours);s.note='Auf verfügbare Zeit gekürzt';s.adapted=true}else{let dest=[1,2,3].map(n=>add(data.date,n)).find(d=>d<=add(monday(data.date),6)&&(!state.raceDate||d<=state.raceDate)&&!eventOn(d).some(e=>e.hours===0)&&!plansOn(d).some(x=>x.status==='planned')&&d>=iso(new Date()));if(dest&&data.title!=='Trainingspause / Unwohlsein'){s.date=dest;s.note='Wegen Termin verschoben';s.adapted=true}else{s.status='skipped';s.note='Wegen Termin/Trainingspause ausgelassen'}}}if(data.title==='Trainingspause / Unwohlsein')adaptUpcoming(data.date,'ill',true);if(state.aiSource)state.needsAIUpdate=true;save();close();notify(state.aiSource?'Termin gespeichert · KI-Neuplanung verfügbar':'Termin gespeichert · Plan angepasst')}}}
function confirmChanges(data,changes,commit,title,description){open({type:'preview',payload:{title,description,changes,commit}})}
function validNum(selector,min,max){let n=Number($(selector)?.value);return Number.isFinite(n)&&n>=min&&n<=max?n:null}
